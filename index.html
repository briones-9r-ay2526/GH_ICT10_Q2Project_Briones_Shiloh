<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PYTHON -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <style>
        body{
            background-color: #8C5A3C;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        nav{
            background-color: #4B2E2B;
        }

        a{
            color: #FFF8F0;
            text-decoration: none;
        }

        .nav-link:hover{
            color: #8C5A3C;
        }

        .nav-link{
            color: #FFF8F0;
        }

        footer{
            background-color: #4B2E2B;
            color: #FFF8F0;
            padding: 10px;
        }

        /* SW CSS */
        .atlas-container{
            width: 100%;
            margin: 0;
            min-height: 100vh;
            background-color: #071a33;
            font-family: 'Poppins', sans-serif;
            color: #071a33;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .atlas-card{
            background-color: #f7f1df;
            border: 3px solid #d4af37;
            border-radius: 8px;
            box-shadow:
                0 0 0 8px #071a33,
                0 0 0 10px #d4af37,
                0 20px 50px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .atlas-header{
            background-color: #0b2345;
            color: #f7f1df;
            text-align: center;
            padding: 45px 30px 35px;
            position: relative;
        }

        .atlas-label{
            color: #d4af37;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 5px;
            margin-bottom: 15px;
        }

        .atlas-header h1{
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            line-height: 0.95;
            margin: 0;
            letter-spacing: 2px;
        }

        .atlas-header h1 span{
            color: #d4af37;
        }

        .gold-line{
            width: 100px;
            height: 3px;
            background-color: #d4af37;
            margin: 25px auto 0;
        }

        .atlas-content{
            text-align: center;
            padding: 45px 30px 50px;
        }

        .atlas-content h2{
            font-family: 'Playfair Display', serif;
            color: #0b2345;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .instruction{
            max-width: 500px;
            margin: 0 auto 30px;
            color: #536070;
            font-size: 0.95rem;
        }

        .input-section{
            max-width: 550px;
            margin: auto;
            text-align: left;
        }

        .input-section label{
            display: block;
            color: #0b2345;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .country-input{
            height: 52px;
            border: 2px solid #c8b98a;
            border-radius: 4px;
            background-color: #fffdf5;
            padding: 0 15px;
            font-family: 'Poppins', sans-serif;
            transition: 0.2s;
        }

        .country-input:focus{
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }

        .reveal-btn{
            width: 100%;
            margin-top: 15px;
            height: 52px;
            background-color: #0b2345;
            color: #f7f1df;
            border: 2px solid #d4af37;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 2px;
            transition: all 0.2s ease;
        }

        .reveal-btn:hover{
            background-color: #d4af37;
            color: #071a33;
            transform: translateY(-2px);
        }

        .output-box{
            max-width: 550px;
            min-height: 80px;
            margin: 30px auto 0;
            padding: 20px;
            border-top: 2px solid #d4af37;
            border-bottom: 2px solid #d4af37;
            color: #0b2345;
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
        }
    </style>

    <title>Q2 Project: Student Showcase 2026</title>
</head>
<body>

    <!-- HEADER -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a href="#"><h4>Student Showcase</h4></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><h4>SW 1</h4></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="skillstest.html"><h4>Skills Test</h4></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pa.html"><h4>PA 2</h4></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="project.html"><h4>Project</h4></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- SEATWORK 1 -->
    <div class="atlas-container">
        <div class="atlas-card">
            <div class="atlas-header">
                <div class="atlas-label">WESTERN EUROPE</div>
                <h1>THE ATLAS OF<br><span>NICKNAMES</span></h1>
                <div class="gold-line"></div>
            </div>

            <div class="atlas-content">
                <h2>Explore the Map</h2>

                <p class="instruction">
                    Enter a Western European country to reveal its famous nickname.
                </p>

                <div class="input-section">
                    <label for="country_input">COUNTRY</label>
                    <input type="text" id="country_input" class="form-control country-input" placeholder="e.g. Germany, France, Switzerland">
                    <button type="button" class="btn reveal-btn" py-click="get_nickname">REVEAL NICKNAME</button>
                </div>

                <div id="output" class="output-box"></div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="text-center">
        <div class="container">
            <p class="mb-0">Student Showcase &mdash; 2nd Quarter Project</p>
        </div>
    </footer>

    <py-script src="main.py"></py-script>
</body>
</html>
