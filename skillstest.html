<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PYTHON -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    
    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <style>
        body{
            background-color: #8C5A3C;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        nav{
            background-color: #4B2E2B;
        }

        a{
            color: #FFF8F0;
            text-decoration: none;
        }

        .nav-link:hover{
            color: #8C5A3C;
        }

        .nav-link{
            color: #FFF8F0;
        }

        footer{
            background-color: #4B2E2B;
            color: #FFF8F0;
            padding: 10px;
        }

        /* SKILLS TEST CSS */
        .lab-section{
            flex: 1;
            background-color: #0b132b;
            background-image: radial-gradient(rgba(111, 255, 233, 0.14) 1px, transparent 1px);
            background-size: 32px 32px;
            padding: 90px 16px;
        }

        .lab-card{
            max-width: 580px;
            margin: 0 auto;
            background-color: #16213e;
            border: 1px solid #2f456e;
            border-top: 4px solid #6fffe9;
            border-radius: 14px;
            padding: 36px 32px;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
        }

        .lab-card h1{
            font-family: 'Orbitron', sans-serif;
            font-size: 1.65rem;
            font-weight: 700;
            color: #6fffe9;
            margin: 0 0 10px 0;
            letter-spacing: 0.5px;
        }

        .lab-card h5{
            font-size: 0.98rem;
            font-weight: 400;
            color: #cbd5e1;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .lab-card h5 b{
            color: #5bc0be;
            font-weight: 600;
        }

        .lab-card form{
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .lab-card label{
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #6fffe9;
            margin: 0;
        }

        .lab-card #element_symbol{
            background-color: #0b132b;
            border: 1.5px solid #3a506b;
            color: #ffffff;
            font-family: 'Roboto Mono', monospace;
            font-size: 1.15rem;
            font-weight: 600;
            padding: 12px 14px;
            border-radius: 8px;
            width: 100%;
        }

        .lab-card #element_symbol::placeholder{
            color: #7c93b5;
            font-weight: 400;
            font-size: 0.95rem;
        }

        .lab-card #element_symbol:focus{
            background-color: #0b132b;
            color: #ffffff;
            border-color: #6fffe9;
            box-shadow: 0 0 0 3px rgba(111, 255, 233, 0.2);
            outline: none;
        }

        .lab-card .btn-success{
            margin-top: 8px;
            background-color: #2ec4b6;
            border: none;
            color: #071120;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 12px 18px;
            border-radius: 8px;
            width: 100%;
        }

        .lab-card .btn-success:hover{
            background-color: #6fffe9;
            color: #071120;
        }

        .lab-card hr{
            border: 0;
            border-top: 1px solid #2f456e;
            margin: 24px 0;
            opacity: 1;
        }

        .lab-card h4.text-primary{
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: #6fffe9 !important;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 0 0 12px 0;
        }

        .lab-card #result{
            background-color: #0b132b;
            border: 1px solid #2f456e;
            border-left: 4px solid #2ec4b6;
            border-radius: 8px;
            padding: 16px;
            min-height: 180px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.95rem;
            color: #f8fafc;
            line-height: 1.5;
        }

        .lab-card #result:empty::before{
            content: "Waiting for symbol input...";
            color: #7c93b5;
        }

    </style>

    <title>Q2 Project: Student Showcase 2026</title>
</head>
<body>

    <!-- HEADER -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a href="#"><h4>Student Showcase</h4></a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><h4>SW 1</h4></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="skillstest.html"><h4>Skills Test</h4></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="pa.html"><h4>PA 2</h4></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="project.html"><h4>Project</h4></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- SKILLS TEST -->
    <main class="lab-section">
        <div class="lab-card">
            <h1>Non-Metal Elements</h1>
            <h5>Enter the <b>chemical symbol</b> of a non-metal element (Example: H, O, Cl, Ne, Xe)</h5>

            <form>
                <label for="element_symbol">Element Symbol</label>
                <input type="text" id="element_symbol" class="form-control form-control-md" placeholder="Input element symbol here">
                <button type="button" class="btn btn-success btn-md" py-click="get_element">Check Details</button>
            </form>

            <hr>

            <h4 class="text-primary">Result</h4>
            <div id="result"></div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center">
        <div class="container">
            <p class="mb-0">Student Showcase &mdash; 2nd Quarter Project</p>
        </div>
    </footer>

    <py-script src="main.py"></py-script>
</body>
</html>
